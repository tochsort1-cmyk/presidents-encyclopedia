<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>World Presidents & Leaders Encyclopedia</title>
    <style>
        body { font-family: 'Khmer OS Siemreap', Arial, sans-serif; margin: 0; background-color: #ecf0f1; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: #2c3e50; color: white; display: flex; flex-direction: column; padding: 15px; }
        .sidebar h3 { font-size: 15px; margin-bottom: 10px; }
        .search-box { width: 100%; padding: 8px; font-size: 14px; border-radius: 4px; border: none; margin-bottom: 10px; box-sizing: border-box; }
        .country-list { flex: 1; overflow-y: auto; background: #34495e; border-radius: 4px; padding: 5px; }
        .country-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #2c3e50; font-size: 14px; }
        .country-item:hover { background-color: #27ae60; border-radius: 3px; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .country-title { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .leader-title { font-size: 16px; font-weight: bold; color: #c0392b; margin-bottom: 20px; }
        .box { background: white; padding: 20px; border-radius: 6px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .box-title { font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        .quote-box { border-left: 4px solid #2980b9; }
        .info-box { border-left: 4px solid #27ae60; }
        .text-en { font-style: italic; color: #555; margin-bottom: 5px; }
        .text-kh { color: #2c3e50; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>🔍 ស្វែងរកប្រទេស ឬមេដឹកនាំ</h3>
        <input type="text" id="searchBox" class="search-box" placeholder="វាយស្វែងរកទីនេះ..." onkeyup="filterCountries()">
        <div id="countryList" class="country-list"></div>
    </div>

    <div class="content">
        <div id="countryName" class="country-title">សូមជ្រើសរើសប្រទេសនៅខាងឆ្វេង</div>
        <div id="leaderName" class="leader-title"></div>

        <div class="box quote-box">
            <div class="box-title" style="color: #2980b9;">សម្រង់សម្តី (Famous Quote)</div>
            <div id="quoteEn" class="text-en"></div>
            <div id="quoteKh" class="text-kh"></div>
        </div>

        <div class="box info-box">
            <div class="box-title" style="color: #27ae60;">សមិទ្ធផលសំខាន់ៗ (Key Achievements)</div>
            <div id="infoEn" class="text-en"></div>
            <div id="infoKh" class="text-kh"></div>
        </div>
    </div>

    <script>
        let presidentsData = [];

        // ດຶງទិន្នន័យពី presidents.json
        fetch('presidents.json')
            .then(response => response.json())
            .then(data => {
                presidentsData = data;
                displayList(presidentsData);
                if(presidentsData.length > 0) {
                    showDetails(presidentsData[0]);
                }
            });

        function displayList(data) {
            const listDiv = document.getElementById('countryList');
            listDiv.innerHTML = '';
            data.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'country-item';
                div.innerText = item.country;
                div.onclick = () => showDetails(item);
                listDiv.appendChild(div);
            });
        }

        function showDetails(item) {
            document.getElementById('countryName').innerText = item.country;
            document.getElementById('leaderName').innerText = `មេដឹកនាំ៖ ${item.leader} (${item.title})`;
            document.getElementById('quoteEn').innerText = `🇬🇧 English: "${item.quote_en}"`;
            document.getElementById('quoteKh').innerText = `🇰🇭 ខ្មែរ៖ "${item.quote_kh}"`;
            document.getElementById('infoEn').innerText = `• English: ${item.info_en}`;
            document.getElementById('infoKh').innerText = `• ខ្មែរ៖ ${item.info_kh}`;
        }

        function filterCountries() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = presidentsData.filter(item => 
                item.country.toLowerCase().includes(query) || item.leader.toLowerCase().includes(query)
            );
            displayList(filtered);
        }
    </script>
</body>
</html>
